name: Framer Birdie Brand Preview

on:
  push:
    branches: [main]
    paths:
      - src/framer-brand-preview.mjs
      - scripts/framer-brand-preview.mjs
      - test/framer-brand-preview.test.mjs
      - .github/workflows/framer-brand-preview.yml
      - config/framer-project-url.txt
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BUILD_BIRDIE_FRAMER_BRAND_PREVIEW"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: birdie-framer-brand-preview
  cancel-in-progress: false

jobs:
  build-preview:
    name: Build safe Framer brand preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "zm56snbdvp-hash/birdie-agent"
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$MANUAL_CONFIRMATION" = "BUILD_BIRDIE_FRAMER_BRAND_PREVIEW"
          fi

      - name: Resolve Framer credentials without printing them
        env:
          FRAMER_API_KEY_SECRET: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL_SECRET: ${{ secrets.FRAMER_PROJECT_URL }}
          FRAMER_PROJECT_URL_VAR: ${{ vars.FRAMER_PROJECT_URL }}
          FRAMER_PROJECT_URL_KNOWN: https://framer.com/projects/mPpX09LJtc1GJZuBy69q-iPGjg
        shell: bash
        run: |
          set -euo pipefail
          FRAMER_PROJECT_URL="${FRAMER_PROJECT_URL_SECRET:-${FRAMER_PROJECT_URL_VAR:-$(cat config/framer-project-url.txt 2>/dev/null || true)}}"
          FRAMER_API_KEY="${FRAMER_API_KEY_SECRET:-}"

          if [ -z "$FRAMER_API_KEY" ]; then
            echo "::error::FRAMER_API_KEY is not available as a GitHub repository secret."
            exit 42
          fi
          if [ -z "$FRAMER_PROJECT_URL" ]; then
            echo "::error::FRAMER_PROJECT_URL could not be resolved."
            exit 43
          fi

          echo "::add-mask::$FRAMER_PROJECT_URL"
          echo "::add-mask::$FRAMER_API_KEY"
          {
            echo "FRAMER_PROJECT_URL=$FRAMER_PROJECT_URL"
            echo "FRAMER_API_KEY=$FRAMER_API_KEY"
            echo "BIRDIE_FRAMER_PREVIEW_CONFIRMATION=BUILD_BIRDIE_FRAMER_BRAND_PREVIEW"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install and test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/framer-brand-preview.mjs
          node --check scripts/framer-brand-preview.mjs

      - name: Build and publish safe preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/framer-brand-preview.mjs > "$RUNNER_TEMP/framer-brand-preview.json"
          jq -e '
            .mode == "PREVIEW_ONLY_NO_PRODUCTION_DEPLOY"
            and (.executionMode == "ISOLATED_BRANCH_PREVIEW" or .executionMode == "DEDICATED_MAIN_PAGE_PREVIEW")
            and .productionDeployed == false
            and .productionDeployAllowed == false
            and .page.path == "/new-birdie"
            and .branch.id != null
          ' "$RUNNER_TEMP/framer-brand-preview.json" > /dev/null

          {
            echo "## Birdie & Breakfast Framer brand preview"
            echo ""
            echo "- Production touched: **no**"
            echo "- Preview page: `/new-birdie`"
            echo "- Execution mode: `$(jq -r '.executionMode' "$RUNNER_TEMP/framer-brand-preview.json")`"
            echo "- Framer target: `$(jq -r '.branch.id' "$RUNNER_TEMP/framer-brand-preview.json")`"
            echo "- Deployment: `$(jq -r '.preview.deployment.id // .preview.deployment // "created"' "$RUNNER_TEMP/framer-brand-preview.json")`"
            echo ""
            echo "The workflow created a preview deployment only. It never calls Framer production deploy."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture version-specific visual proof
        shell: bash
        run: |
          set -euo pipefail
          VERSION_HOST="$(jq -r '.preview.hostnames[]? | select(.type == "version") | .hostname' "$RUNNER_TEMP/framer-brand-preview.json" | head -n1)"
          test -n "$VERSION_HOST"
          VERSION_URL="https://$VERSION_HOST/new-birdie?proof=$GITHUB_SHA"
          echo "$VERSION_URL" > "$RUNNER_TEMP/framer-preview-url.txt"

          for attempt in $(seq 1 24); do
            code="$(curl -L -sS -o "$RUNNER_TEMP/framer-rendered.html" -w '%{http_code}' "$VERSION_URL" || true)"
            if [ "$code" = "200" ] && grep -Fq "Art to live with." "$RUNNER_TEMP/framer-rendered.html"; then
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "::error::Version preview did not become ready with the new hero copy."
              exit 61
            fi
            sleep 5
          done

          npx -y playwright@1.55.0 install --with-deps chromium
          npx -y playwright@1.55.0 screenshot             --device="Desktop Chrome"             --full-page             "$VERSION_URL"             "$RUNNER_TEMP/framer-brand-preview.png"

      - name: Upload sanitized preview receipt and visual proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birdie-framer-brand-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/framer-brand-preview.json
            ${{ runner.temp }}/framer-preview-url.txt
            ${{ runner.temp }}/framer-brand-preview.png
          if-no-files-found: error
          retention-days: 30
