name: Birdie Moments Staging Bootstrap

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Provider action"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply-app-store

permissions:
  contents: read

jobs:
  bootstrap:
    name: Birdie Moments staging provider bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: birdie-moments-staging
    concurrency:
      group: birdie-moments-staging-bootstrap
      cancel-in-progress: false

    steps:
      - name: Checkout tested Moments integration commit
        uses: actions/checkout@v4
        with:
          ref: 0fe0cf7a39733af45d767e243e143c2e28de9be0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run guarded provider bootstrap
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_B64: ${{ inputs.action == 'dry-run' && secrets.APP_STORE_CONNECT_KEY_B64 || '' }}
          GELATO_API_KEY: ${{ secrets.GELATO_API_KEY }}
          GELATO_PRODUCT_UID: ${{ vars.GELATO_PRODUCT_UID }}
        run: |
          set -euo pipefail
          birdie_asc_key_path=''
          trap 'if [[ -n "${birdie_asc_key_path:-}" ]]; then rm -f -- "$birdie_asc_key_path"; fi' EXIT
          if [[ "${{ inputs.action }}" == "dry-run" && -z "${APP_STORE_CONNECT_PRIVATE_KEY//[[:space:]]/}" && -n "${APP_STORE_CONNECT_KEY_B64//[[:space:]]/}" ]]; then
            birdie_asc_key_path="$(mktemp "$RUNNER_TEMP/birdie-moments-asc-key.XXXXXX")"
            chmod 600 "$birdie_asc_key_path"
            export APP_STORE_CONNECT_PRIVATE_KEY_PATH="$birdie_asc_key_path"
            python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          try:
              key_bytes = base64.b64decode(os.environ["APP_STORE_CONNECT_KEY_B64"], validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("Invalid APP_STORE_CONNECT_KEY_B64 encoding") from None
          if not key_bytes:
              raise SystemExit("APP_STORE_CONNECT_KEY_B64 decoded to empty content")
          Path(os.environ["APP_STORE_CONNECT_PRIVATE_KEY_PATH"]).write_bytes(key_bytes)
          PY
          fi
          unset APP_STORE_CONNECT_KEY_B64
          if [[ "${{ inputs.action }}" == "dry-run" ]]; then
            node -  <<'APPLE_DIAG'
          'use strict';
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const MAX_BYTES = 64 * 1024;
          const PEM = /^-----BEGIN (?:PRIVATE KEY|EC PRIVATE KEY|RSA PRIVATE KEY|ENCRYPTED PRIVATE KEY)-----/;
          const BASE64 = /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/;
          
          function readInput(env) {
            const raw = env.APP_STORE_CONNECT_PRIVATE_KEY?.trim();
            if (raw) return Buffer.byteLength(raw) > MAX_BYTES
              ? { source: 'RAW_ENV', status: 'TOO_LARGE' }
              : { source: 'RAW_ENV', status: 'PRESENT', bytes: Buffer.from(raw) };
            const filename = env.APP_STORE_CONNECT_PRIVATE_KEY_PATH?.trim();
            if (!filename) return { source: 'NONE', status: 'MISSING' };
            let fd;
            try {
              fd = fs.openSync(filename, 'r');
              if (!fs.fstatSync(fd).isFile()) return { source: 'PATH_ENV', status: 'UNREADABLE' };
              const bytes = Buffer.alloc(MAX_BYTES + 1);
              let count = 0;
              while (count < bytes.length) {
                const read = fs.readSync(fd, bytes, count, bytes.length - count, null);
                if (!read) break;
                count += read;
              }
              if (count > MAX_BYTES) return { source: 'PATH_ENV', status: 'TOO_LARGE' };
              return { source: 'PATH_ENV', status: count ? 'PRESENT' : 'EMPTY', bytes: bytes.subarray(0, count) };
            } catch { return { source: 'PATH_ENV', status: 'UNREADABLE' }; }
            finally { if (fd !== undefined) { try { fs.closeSync(fd); } catch {} } }
          }
          
          function diagnoseAppleKey({ env = process.env } = {}) {
            const input = readInput(env);
            const report = {
              schemaVersion: 'birdie-moments.apple-key-diagnostic.v1', source: input.source, inputStatus: input.status,
              recognizedFormat: input.status === 'PRESENT' ? 'UNRECOGNIZED' : 'NONE',
              parseResult: input.status === 'PRESENT' ? 'INVALID' : 'NOT_RUN',
              privateKeyType: 'UNKNOWN', curve: 'UNKNOWN', p256PrivateKey: false,
              directPemUsable: false, transformationRequired: false, encryptedPem: false,
            };
            if (input.status !== 'PRESENT') return report;
            // Match the bootstrap's UTF-8 path reading and trimmed raw-env precedence.
            const originalText = input.bytes.toString('utf8');
            const text = originalText.trim();
            function check(value, format, { direct = false, der = false } = {}) {
              if (!der) {
                report.recognizedFormat = format;
                report.encryptedPem = String(value).trim().startsWith('-----BEGIN ENCRYPTED PRIVATE KEY-----');
              }
              try {
                const key = crypto.createPrivateKey(der ? { key: value, format: 'der', type: 'pkcs8' } : value);
                const type = key.asymmetricKeyType;
                const curve = type === 'ec' ? key.asymmetricKeyDetails?.namedCurve : undefined;
                const p256 = type === 'ec' && ['prime256v1', 'secp256r1', 'P-256'].includes(curve);
                Object.assign(report, {
                  recognizedFormat: format, parseResult: 'VALID', p256PrivateKey: p256,
                  privateKeyType: type === 'ec' ? 'EC' : ['rsa', 'rsa-pss'].includes(type) ? 'RSA' : 'OTHER',
                  curve: p256 ? 'P_256' : type !== 'ec' ? 'NOT_APPLICABLE' : curve ? 'OTHER' : 'UNKNOWN',
                  directPemUsable: direct, transformationRequired: !direct,
                });
                return true;
              } catch { return false; }
            }
            if (PEM.test(text) && check(originalText, 'PEM', { direct: true })) return report;
            // Bounded individual candidates only; never recursively decode or mutate env.
            if (PEM.test(text) && /\\[rn]/.test(text)
              && check(text.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\\r/g, '\n'), 'PEM_WITH_LITERAL_NEWLINES')) return report;
            if (text.startsWith('"') && text.endsWith('"')) {
              try {
                const decoded = JSON.parse(text);
                if (typeof decoded === 'string' && PEM.test(decoded.trim()) && check(decoded, 'JSON_STRING_PEM')) return report;
              } catch {}
            }
            const compact = text.replace(/[\r\n]/g, '');
            if (compact && BASE64.test(compact)) {
              const decoded = Buffer.from(compact, 'base64');
              if (decoded.toString('base64') === compact) {
                if (PEM.test(decoded.toString('utf8').trim()) && check(decoded.toString('utf8'), 'BASE64_WRAPPED_PEM')) return report;
                if (decoded[0] === 0x30 && check(decoded, 'BASE64_WRAPPED_DER_PKCS8', { der: true })) return report;
              }
            }
            if (input.source === 'PATH_ENV' && input.bytes[0] === 0x30) check(input.bytes, 'DER_PKCS8', { der: true });
            return report;
          }
          
          function main() {
            try {
              const output = process.argv[2] || 'birdie-moments-apple-key-diagnostic.json';
              fs.writeFileSync(output, `${JSON.stringify(diagnoseAppleKey(), null, 2)}\n`, { mode: 0o600 });
            } catch {
              process.stderr.write('Apple key diagnostic could not be written.\n');
              process.exitCode = 1;
            }
          }
          main();
          APPLE_DIAG
            node - --catalog-shape <<'GELATO_DIAG'
          'use strict';
          const fs = require('node:fs');
          const URL = 'https://product.gelatoapis.com/v3/catalogs/posters';
          const type = value => value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value;
          const types = values => [...new Set(values.map(type))].sort();
          const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
          async function diagnose({ apiKey = process.env.GELATO_API_KEY, probeCatalog = false,
            fetchImpl = globalThis.fetch } = {}) {
            const output = { headerSyntaxValid: false, catalogHttpStatus: null,
              rootType: 'unavailable', productAttributesType: 'unavailable',
              attrElementTypes: [], valuesTypes: [], valueElementTypes: [], hasProductAttributeUid: false };
            const key = typeof apiKey === 'string' ? apiKey.trim() : '';
            if (!key) return output;
            let headers;
            try { headers = new Headers({ 'X-API-KEY': key, accept: 'application/json' }); }
            catch { return output; }
            output.headerSyntaxValid = true;
            if (!probeCatalog) return output;
            try {
              const response = await fetchImpl(URL, { method: 'GET', headers,
                redirect: 'error', signal: AbortSignal.timeout(15000) });
              output.catalogHttpStatus = Number.isInteger(response.status) && response.status >= 100 &&
                response.status <= 599 ? response.status : null;
              if (!response.ok) return output;
              const body = await response.json();
              output.rootType = type(body);
              const attributes = object(body) ? body.productAttributes : undefined;
              output.productAttributesType = type(attributes);
              if (!Array.isArray(attributes)) return output;
              output.attrElementTypes = types(attributes);
              const values = attributes.map(entry => object(entry) ? entry.values : undefined);
              output.valuesTypes = types(values);
              output.valueElementTypes = types(values.filter(Array.isArray).flat());
              output.hasProductAttributeUid = attributes.some(entry => object(entry) &&
                Object.prototype.hasOwnProperty.call(entry, 'productAttributeUid'));
            } catch { /* Never serialize error messages, headers, response text, or values. */ }
            return output;
          }
          module.exports = { diagnose };
          {
            diagnose({ probeCatalog: process.argv.includes('--catalog-shape') }).then(output => {
              fs.writeFileSync('birdie-moments-gelato-diagnostic.json', JSON.stringify(output, null, 2) + '\n');
            }).catch(() => { process.stderr.write('GELATO_DIAGNOSTIC_WRITE_FAILED\n'); process.exitCode = 1; });
          }
          GELATO_DIAG
          fi
          if [[ "${{ inputs.action }}" == "apply-app-store" ]]; then
            node scripts/birdie-moments-staging-bootstrap.mjs --apply-app-store > birdie-moments-staging-result.json
          else
            node scripts/birdie-moments-staging-bootstrap.mjs > birdie-moments-staging-result.json
          fi

      - name: Publish sanitized status summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f birdie-moments-staging-result.json ]]; then
            node - <<'NODE'
          const fs = require('fs');
          const input = JSON.parse(fs.readFileSync('birdie-moments-staging-result.json', 'utf8'));
          function safeError(result, provider) {
            if (result?.status !== 'ERROR') return null;
            const message = typeof result.message === 'string' ? result.message : '';
            const httpMatch = message.match(provider === 'appStore'
              ? /^App Store Connect HTTP ([45][0-9]{2})$/
              : /^Gelato (?:catalog|product search|product validation) HTTP ([45][0-9]{2})$/);
            const rawStatus = result.httpStatus;
            const httpStatus = Number.isInteger(rawStatus) && rawStatus >= 400 && rawStatus <= 599
              ? rawStatus : (httpMatch ? Number(httpMatch[1]) : null);
            let category = 'UNCLASSIFIED_ERROR';
            if (httpStatus === 401) category = 'HTTP_UNAUTHORIZED';
            else if (httpStatus === 403) category = 'HTTP_FORBIDDEN';
            else if (httpStatus === 404) category = 'HTTP_NOT_FOUND';
            else if (httpStatus === 429) category = 'HTTP_RATE_LIMITED';
            else if (httpStatus >= 500) category = 'HTTP_SERVER_ERROR';
            else if (httpStatus >= 400) category = 'HTTP_CLIENT_ERROR';
            else if (message === 'fetch failed') category = 'NETWORK_ERROR';
            else if (provider === 'gelato' && (/^Headers\.(?:append|set): "[\s\S]*" is an invalid header value\.$/.test(message) || /^Cannot convert argument to a ByteString because the character at index [0-9]+ has a value of [0-9]+ which is greater than 255\.$/.test(message))) category = 'GELATO_HEADER_FORMAT_ERROR';
            else if (provider === 'gelato' && ([
              '((intermediate value) ?? []).map is not a function',
              '(catalog?.productAttributes ?? []).map is not a function',
              '(entry.values ?? []).map is not a function'
            ].includes(message) || /^Cannot read properties of (?:null|undefined) \(reading 'productAttribute(?:Value)?Uid'\)$/.test(message))) category = 'GELATO_CATALOG_SCHEMA_ERROR';
            else if (provider === 'gelato' && [
              '((intermediate value) ?? []).filter is not a function',
              '(search?.products ?? []).filter is not a function'
            ].includes(message)) category = 'GELATO_SEARCH_SCHEMA_ERROR';
            else if (provider === 'appStore' && /^error:[0-9a-f]+:(?:DECODER|PEM|asn1 encoding|elliptic curve) routines:/i.test(message)) category = 'APPLE_KEY_ERROR';
            else if (provider === 'appStore' && /^Expected exactly one App Store app for [^;\r\n]+; found [0-9]+$/.test(message)) category = 'APPLE_APP_LOOKUP_ERROR';
            else if (provider === 'gelato' && /^Gelato catalog [^\s\r\n]+ does not expose (?:PaperFormat|Orientation)=[^\s\r\n]+$/.test(message)) category = 'GELATO_CATALOG_ATTRIBUTES_ERROR';
            else if (provider === 'gelato' && /^Gelato product [^\r\n]+ is not a printable A3 portrait poster$/.test(message)) category = 'GELATO_PRODUCT_VALIDATION_ERROR';
            return { category, httpStatus };
          }
          function readDiagnostic(name) {
            if (input.mode !== 'DRY_RUN' || !fs.existsSync(name)) return null;
            const choice = (value, allowed) => allowed.includes(value) ? value : null;
            const boolean = value => typeof value === 'boolean' ? value : null;
            const typeNames = ['unavailable', 'undefined', 'null', 'array', 'object', 'string', 'number', 'boolean', 'bigint', 'symbol', 'function'];
            const typeList = value => Array.isArray(value) ? [...new Set(value.filter(item => typeNames.includes(item)))].sort() : [];
            try {
              const data = JSON.parse(fs.readFileSync(name, 'utf8'));
              if (!data || typeof data !== 'object' || Array.isArray(data)) return { status: 'DIAGNOSTIC_UNAVAILABLE' };
              if (name === 'birdie-moments-apple-key-diagnostic.json') return {
                schemaVersion: 'birdie-moments.apple-key-diagnostic.v1',
                source: choice(data.source, ['NONE', 'RAW_ENV', 'PATH_ENV']),
                inputStatus: choice(data.inputStatus, ['PRESENT', 'MISSING', 'EMPTY', 'TOO_LARGE', 'UNREADABLE']),
                recognizedFormat: choice(data.recognizedFormat, ['NONE', 'UNRECOGNIZED', 'PEM', 'PEM_WITH_LITERAL_NEWLINES', 'JSON_STRING_PEM', 'BASE64_WRAPPED_PEM', 'BASE64_WRAPPED_DER_PKCS8', 'DER_PKCS8']),
                parseResult: choice(data.parseResult, ['VALID', 'INVALID', 'NOT_RUN']),
                privateKeyType: choice(data.privateKeyType, ['UNKNOWN', 'EC', 'RSA', 'OTHER']),
                curve: choice(data.curve, ['UNKNOWN', 'P_256', 'OTHER', 'NOT_APPLICABLE']),
                p256PrivateKey: boolean(data.p256PrivateKey),
                directPemUsable: boolean(data.directPemUsable),
                transformationRequired: boolean(data.transformationRequired),
                encryptedPem: boolean(data.encryptedPem)
              };
              if (name === 'birdie-moments-gelato-diagnostic.json') return {
                headerSyntaxValid: boolean(data.headerSyntaxValid),
                catalogHttpStatus: Number.isInteger(data.catalogHttpStatus) && data.catalogHttpStatus >= 100 && data.catalogHttpStatus <= 599 ? data.catalogHttpStatus : null,
                rootType: choice(data.rootType, typeNames),
                productAttributesType: choice(data.productAttributesType, typeNames),
                attrElementTypes: typeList(data.attrElementTypes),
                valuesTypes: typeList(data.valuesTypes),
                valueElementTypes: typeList(data.valueElementTypes),
                hasProductAttributeUid: boolean(data.hasProductAttributeUid)
              };
              return null;
            }
            catch { return { status: 'DIAGNOSTIC_UNAVAILABLE' }; }
          }
          const summary = {
            schemaVersion: input.schemaVersion,
            mode: input.mode,
            diagnostics: {
              appleKey: readDiagnostic('birdie-moments-apple-key-diagnostic.json'),
              gelatoCatalog: readDiagnostic('birdie-moments-gelato-diagnostic.json')
            },
            sourceRef: '0fe0cf7a39733af45d767e243e143c2e28de9be0',
            appStore: {
              status: input.appStore?.status ?? null,
              error: safeError(input.appStore, 'appStore'),
              missing: input.appStore?.missing ?? [],
              bundleId: input.appStore?.app?.bundleId ?? input.appStore?.desired?.bundleId ?? 'de.birdieandbreakfast.birdie',
              products: (input.appStore?.products ?? input.appStore?.desired?.products ?? []).map((item) => ({
                productType: item.productType,
                productId: item.productId,
                status: item.status ?? null,
                targetCustomerPriceEUR: item.targetCustomerPrice ?? item.targetCustomerPriceEUR ?? null
              }))
            },
            gelato: {
              status: input.gelato?.status ?? null,
              error: safeError(input.gelato, 'gelato'),
              missing: input.gelato?.missing ?? [],
              candidateCount: input.gelato?.candidateCount ?? null
            }
          };
          fs.writeFileSync('birdie-moments-staging-summary.json', JSON.stringify(summary, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Birdie Moments staging\n\n\`\`\`json\n${JSON.stringify(summary, null, 2)}\n\`\`\`\n`);
          NODE
          else
            printf '## Birdie Moments staging\n\nBootstrap produced no result file.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized staging receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdie-moments-staging-receipt
          path: birdie-moments-staging-summary.json
          if-no-files-found: ignore
          retention-days: 14
