name: Birdie Moments Live Integration Tests

on:
  push:
    branches:
      - feature/birdie-moments-v1-live-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/birdie-moments-v1-live-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run complete repository test suite
        run: |
          set +e
          npm test > birdie-moments-test-output.txt 2>&1
          status=$?
          cat birdie-moments-test-output.txt
          exit $status

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdie-moments-test-output
          path: birdie-moments-test-output.txt
          if-no-files-found: error
