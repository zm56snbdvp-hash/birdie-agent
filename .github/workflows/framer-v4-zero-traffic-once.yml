name: Framer V4 one-time zero-traffic candidate

on:
  push:
    branches:
      - chore/stage-a-pin-framer-v4-20260818
    paths:
      - .github/workflows/framer-v4-zero-traffic-once.yml

permissions: {}

concurrency:
  group: birdie-agent-framer-v4-zero-traffic-once
  cancel-in-progress: false

env:
  RELEASE_SHA: 782f9ee64cb21c719cf7809ecbb98332a64f555e
  EXPECTED_REPOSITORY: zm56snbdvp-hash/birdie-agent
  GCP_PROJECT_ID: gen-lang-client-0251788487
  GCP_REGION: europe-west3
  CLOUD_RUN_SERVICE: birdie-agent
  EXPECTED_WIF_PROVIDER: projects/893591677320/locations/global/workloadIdentityPools/github-birdie-agent/providers/github-birdie-agent
  EXPECTED_DEPLOYER_SERVICE_ACCOUNT: birdie-github-deployer@gen-lang-client-0251788487.iam.gserviceaccount.com
  EXPECTED_RUNTIME_SERVICE_ACCOUNT: 893591677320-compute@developer.gserviceaccount.com
  EXPECTED_ARTIFACT_REPOSITORY: birdie-agent-releases

jobs:
  deploy-zero-traffic:
    name: Build, deploy, and prove zero traffic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: birdie-cloud-run-no-traffic
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout one-time runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable invocation
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          ENVIRONMENT_GUARD: ${{ vars.BIRDIE_NO_TRAFFIC_ENVIRONMENT_GUARD }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/chore/stage-a-pin-framer-v4-20260818"
          test "$GITHUB_EVENT_NAME" = "push"
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$WIF_PROVIDER" = "$EXPECTED_WIF_PROVIDER"
          test "$DEPLOYER_SERVICE_ACCOUNT" = "$EXPECTED_DEPLOYER_SERVICE_ACCOUNT"
          test "$RUNTIME_SERVICE_ACCOUNT" = "$EXPECTED_RUNTIME_SERVICE_ACCOUNT"
          test "$ARTIFACT_REPOSITORY" = "$EXPECTED_ARTIFACT_REPOSITORY"
          test "$ENVIRONMENT_GUARD" = "BIRDIE_NO_TRAFFIC_PROTECTED_V1"

      - name: Validate exact V4 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-src"
          mkdir -p "$RUNNER_TEMP/release-src"
          git archive "$RELEASE_SHA" | tar -x -C "$RUNNER_TEMP/release-src"
          cd "$RUNNER_TEMP/release-src"
          npm ci
          npm test
          node --check src/framer-v4-service.mjs
          grep -Fq 'FRAMER_UNSAFE_PREVIEW_DISABLED' src/framer-router.mjs
          grep -Fq 'productionDeployExposed: false' src/framer-v4-service.mjs
          ! grep -Eq '\.deploy\s*\(' src/framer-v4-service.mjs

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: "577.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Capture current traffic and runtime identity
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > "$RUNNER_TEMP/before.json"
          current_sa="$(jq -r '.spec.template.spec.serviceAccountName // .template.serviceAccount // empty' "$RUNNER_TEMP/before.json")"
          test "$current_sa" = "$RUNTIME_SERVICE_ACCOUNT"
          jq -e '[.status.traffic[]? | select((.percent // 0) > 0)] | length == 1' "$RUNNER_TEMP/before.json" >/dev/null
          jq -e '[.status.traffic[]? | select((.percent // 0) > 0)][0].percent == 100' "$RUNNER_TEMP/before.json" >/dev/null
          jq -S '[.status.traffic[]? | {revisionName:(.revisionName // null),percent:(.percent // 0),tag:(.tag // null),latestRevision:(.latestRevision // false)}] | sort_by([.revisionName,.percent,.tag,.latestRevision])' "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/traffic-before.json"

      - name: Build and push immutable release image
        env:
          ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/birdie-agent"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          cd "$RUNNER_TEMP/release-src"
          docker build --pull -t "$IMAGE_URI:$RELEASE_SHA" .
          docker push "$IMAGE_URI:$RELEASE_SHA"
          digest="$(gcloud artifacts docker images describe "$IMAGE_URI:$RELEASE_SHA" --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Deploy candidate with zero traffic
        shell: bash
        run: |
          set -euo pipefail
          short="${RELEASE_SHA:0:7}"
          tag="framer-v4-${short}"
          suffix="fv4-${short}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "$IMAGE_URI@$IMAGE_DIGEST" \
            --revision-suffix "$suffix" \
            --tag "$tag" \
            --no-traffic \
            --quiet
          echo "CANDIDATE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Prove existing traffic unchanged and candidate is zero traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > "$RUNNER_TEMP/after.json"
          jq -e '[.status.traffic[]? | select((.percent // 0) > 0)] | length == 1' "$RUNNER_TEMP/after.json" >/dev/null
          jq -e '[.status.traffic[]? | select((.percent // 0) > 0)][0].percent == 100' "$RUNNER_TEMP/after.json" >/dev/null
          candidate_revision="$(jq -r --arg tag "$CANDIDATE_TAG" '[.status.traffic[]? | select(.tag == $tag)][0].revisionName // empty' "$RUNNER_TEMP/after.json")"
          test -n "$candidate_revision"
          candidate_percent="$(jq -r --arg rev "$candidate_revision" '[.status.traffic[]? | select(.revisionName == $rev)][0].percent // 0' "$RUNNER_TEMP/after.json")"
          test "$candidate_percent" = "0"
          before_live="$(jq -r '[.[] | select(.percent > 0)][0].revisionName' "$RUNNER_TEMP/traffic-before.json")"
          after_live="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)][0].revisionName' "$RUNNER_TEMP/after.json")"
          test "$before_live" = "$after_live"
          echo "Candidate $candidate_revision deployed at 0% traffic; live revision unchanged: $after_live"
