name: Deploy Birdie Watch Live
run-name: Birdie Watch production ${{ inputs.release_sha }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact current protected main SHA"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_BIRDIE_WATCH_PRODUCTION"
        required: true
        type: string

permissions: {}

concurrency:
  group: birdie-watch-live
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: zm56snbdvp-hash/birdie-agent
  EXPECTED_REPOSITORY_ID: "1329217661"
  EXPECTED_OWNER_ID: "315131667"
  GCP_PROJECT_ID: gen-lang-client-0251788487
  GCP_PROJECT_NUMBER: "893591677320"
  GCP_REGION: europe-west3
  CLOUD_RUN_SERVICE: birdie-agent
  EXPECTED_WIF_PROVIDER: projects/893591677320/locations/global/workloadIdentityPools/github-birdie-agent/providers/github-birdie-agent
  EXPECTED_DEPLOYER_SERVICE_ACCOUNT: birdie-github-deployer@gen-lang-client-0251788487.iam.gserviceaccount.com
  EXPECTED_RUNTIME_SERVICE_ACCOUNT: 893591677320-compute@developer.gserviceaccount.com
  ARTIFACT_REPOSITORY: birdie-agent-releases
  WATCH_SECRET: birdie-watch-api-key

jobs:
  validate:
    name: Validate exact Watch release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable invocation
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
          ACTUAL_OWNER_ID: ${{ github.repository_owner_id }}
          REF_PROTECTED: ${{ github.ref_protected }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTUAL_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$ACTUAL_OWNER_ID" = "$EXPECTED_OWNER_ID"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "DEPLOY_BIRDIE_WATCH_PRODUCTION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Run required release gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci && npm test

      - name: Build credential-free image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "birdie-watch-release:$GITHUB_SHA" .
          docker save "birdie-watch-release:$GITHUB_SHA" \
            --output "$RUNNER_TEMP/birdie-watch-release.tar"

      - name: Upload immutable image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birdie-watch-image-${{ github.sha }}
          path: ${{ runner.temp }}/birdie-watch-release.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy, verify, and promote exact Watch revision
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: birdie-watch-live
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate protected provider coordinates
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WIF_PROVIDER" = "$EXPECTED_WIF_PROVIDER"
          test "$DEPLOYER_SERVICE_ACCOUNT" = "$EXPECTED_DEPLOYER_SERVICE_ACCOUNT"
          test "$RUNTIME_SERVICE_ACCOUNT" = "$EXPECTED_RUNTIME_SERVICE_ACCOUNT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download verified image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: birdie-watch-image-${{ github.sha }}
          path: ${{ runner.temp }}/image-artifact

      - name: Load verified image
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/image-artifact/birdie-watch-release.tar"
          docker load --input "$RUNNER_TEMP/image-artifact/birdie-watch-release.tar"
          docker image inspect "birdie-watch-release:$GITHUB_SHA" > /dev/null

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: "577.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Capture protected production state
        id: before
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/service-before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/iam-before.json"
          runtime_sa="$(jq -r '.spec.template.spec.serviceAccountName // .template.serviceAccount // empty' "$RUNNER_TEMP/service-before.json")"
          test "$runtime_sa" = "$RUNTIME_SERVICE_ACCOUNT"
          previous_revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)] | if length == 1 and .[0].percent == 100 then .[0].revisionName else empty end' "$RUNNER_TEMP/service-before.json")"
          test -n "$previous_revision"
          jq -S '.bindings // []' "$RUNNER_TEMP/iam-before.json" > "$RUNNER_TEMP/iam-before-normalized.json"
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"
          echo "runtime_service_account=$runtime_sa" >> "$GITHUB_OUTPUT"

      - name: Verify enabled Watch secret metadata
        shell: bash
        run: |
          set -euo pipefail
          secret_name="$(gcloud secrets describe "$WATCH_SECRET" --project "$GCP_PROJECT_ID" --format='value(name)')"
          test "$secret_name" = "projects/$GCP_PROJECT_NUMBER/secrets/$WATCH_SECRET"
          secret_state="$(gcloud secrets versions describe latest --secret "$WATCH_SECRET" --project "$GCP_PROJECT_ID" --format='value(state)')"
          test "$secret_state" = "ENABLED"

      - name: Push immutable image
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          image_uri="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE"
          image_tag="$image_uri:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "birdie-watch-release:$GITHUB_SHA" "$image_tag"
          docker push "$image_tag"
          image_digest="$(gcloud artifacts docker images describe "$image_tag" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Deploy configured Watch candidate at zero traffic
        id: candidate
        env:
          IMAGE_URI: ${{ steps.registry.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.registry.outputs.image_digest }}
          PREVIOUS_REVISION: ${{ steps.before.outputs.previous_revision }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.before.outputs.runtime_service_account }}
        shell: bash
        run: |
          set -euo pipefail
          revision_suffix="watch-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_tag="watch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          revision="$CLOUD_RUN_SERVICE-$revision_suffix"
          test "$revision" != "$PREVIOUS_REVISION"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "$IMAGE_URI@$IMAGE_DIGEST" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "$revision_suffix" \
            --tag "$candidate_tag" \
            --no-traffic \
            --update-secrets "BIRDIE_WATCH_API_KEY=$WATCH_SECRET:latest" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/service-candidate.json"
          candidate_url="$(jq -r --arg revision "$revision" --arg tag "$candidate_tag" '[.status.traffic[]? | select(.revisionName == $revision and .tag == $tag and (.percent // 0) == 0)][0].url // empty' "$RUNNER_TEMP/service-candidate.json")"
          [[ "$candidate_url" =~ ^https:// ]]
          jq -e --arg previous "$PREVIOUS_REVISION" --arg revision "$revision" --arg tag "$candidate_tag" '
            ([.status.traffic[]? | select((.percent // 0) > 0)] | length == 1) and
            ([.status.traffic[]? | select((.percent // 0) > 0)][0].revisionName == $previous) and
            ([.status.traffic[]? | select((.percent // 0) > 0)][0].percent == 100) and
            ([.status.traffic[]? | select(.revisionName == $revision and .tag == $tag and (.percent // 0) == 0)] | length == 1)
          ' "$RUNNER_TEMP/service-candidate.json" > /dev/null
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"

      - name: Verify scoped Watch candidate
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.candidate_url }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.before.outputs.runtime_service_account }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run revisions describe "$REVISION" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/revision-candidate.json"
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" --arg secret "$WATCH_SECRET" '
            (.spec.serviceAccountName // .spec.template.spec.serviceAccountName // .template.serviceAccount) == $sa and
            ([.spec.containers[0].env[]? | select(
              .name == "BIRDIE_WATCH_API_KEY" and
              .valueFrom.secretKeyRef.name == $secret and
              .valueFrom.secretKeyRef.key == "latest"
            )] | length == 1)
          ' "$RUNNER_TEMP/revision-candidate.json" > /dev/null
          curl --fail --silent --show-error --retry 4 "$CANDIDATE_URL/" \
            | jq -e '.success == true and .service == "Birdie Agent" and .watch == "SCOPED_AUTH_READY"' > /dev/null
          assert_watch_unauthorized() {
            local method="$1"
            local path="$2"
            local output="$3"
            local status
            if [ "$method" = "GET" ]; then
              status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' "$CANDIDATE_URL$path")"
            else
              status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' --request "$method" --header 'Content-Type: application/json' --data '{}' "$CANDIDATE_URL$path")"
            fi
            test "$status" = "401"
            jq -e '.success == false and .error == "WATCH_UNAUTHORIZED" and .message == "Birdie Watch authentication failed."' "$output" > /dev/null
          }
          assert_watch_unauthorized GET /watch/briefing "$RUNNER_TEMP/watch-briefing-unauthorized.json"
          assert_watch_unauthorized POST /watch/command "$RUNNER_TEMP/watch-command-unauthorized.json"
          assert_watch_unauthorized POST /watch/mail/reply "$RUNNER_TEMP/watch-mail-reply-unauthorized.json"

      - name: Verify IAM unchanged before promotion
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/iam-candidate.json"
          jq -S '.bindings // []' "$RUNNER_TEMP/iam-candidate.json" > "$RUNNER_TEMP/iam-candidate-normalized.json"
          cmp "$RUNNER_TEMP/iam-before-normalized.json" "$RUNNER_TEMP/iam-candidate-normalized.json"

      - name: Promote exact verified Watch revision to production
        id: promote
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$REVISION=100" \
            --quiet

      - name: Verify promoted production state
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
          PREVIOUS_REVISION: ${{ steps.before.outputs.previous_revision }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.before.outputs.runtime_service_account }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/service-live.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/iam-live.json"
          jq -e --arg revision "$REVISION" '[.status.traffic[]? | select((.percent // 0) > 0)] | length == 1 and .[0].revisionName == $revision and .[0].percent == 100' "$RUNNER_TEMP/service-live.json" > /dev/null
          live_runtime_sa="$(jq -r '.spec.template.spec.serviceAccountName // .template.serviceAccount // empty' "$RUNNER_TEMP/service-live.json")"
          test "$live_runtime_sa" = "$RUNTIME_SERVICE_ACCOUNT"
          test "$REVISION" != "$PREVIOUS_REVISION"
          jq -S '.bindings // []' "$RUNNER_TEMP/iam-live.json" > "$RUNNER_TEMP/iam-live-normalized.json"
          cmp "$RUNNER_TEMP/iam-before-normalized.json" "$RUNNER_TEMP/iam-live-normalized.json"
          service_url="$(jq -r '.status.url // empty' "$RUNNER_TEMP/service-live.json")"
          [[ "$service_url" =~ ^https:// ]]
          curl --fail --silent --show-error --retry 4 "$service_url/" \
            | jq -e '.success == true and .service == "Birdie Agent" and .watch == "SCOPED_AUTH_READY"' > /dev/null
          assert_watch_unauthorized() {
            local method="$1"
            local path="$2"
            local output="$3"
            local status
            if [ "$method" = "GET" ]; then
              status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' "$service_url$path")"
            else
              status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' --request "$method" --header 'Content-Type: application/json' --data '{}' "$service_url$path")"
            fi
            test "$status" = "401"
            jq -e '.success == false and .error == "WATCH_UNAUTHORIZED" and .message == "Birdie Watch authentication failed."' "$output" > /dev/null
          }
          assert_watch_unauthorized GET /watch/briefing "$RUNNER_TEMP/live-watch-briefing-unauthorized.json"
          assert_watch_unauthorized POST /watch/command "$RUNNER_TEMP/live-watch-command-unauthorized.json"
          assert_watch_unauthorized POST /watch/mail/reply "$RUNNER_TEMP/live-watch-mail-reply-unauthorized.json"

      - name: Roll back traffic if live verification fails
        if: failure() && steps.promote.outcome == 'success'
        env:
          PREVIOUS_REVISION: ${{ steps.before.outputs.previous_revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$PREVIOUS_REVISION=100" \
            --quiet
