name: Birdie Smart Shop Tests

on:
  push:
    branches:
      - feature/birdie-smart-shop-v1
  pull_request:
    paths:
      - "src/affiliate-commerce/**"
      - "test/birdie-smart-shop*.test.mjs"
      - "db/009_affiliate_commerce.sql"
      - ".github/workflows/birdie-smart-shop-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Smart Shop tests
        run: node --test test/birdie-smart-shop*.test.mjs
