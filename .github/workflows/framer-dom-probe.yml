name: Framer DOM Probe

on:
  push:
    branches: [main]
    paths:
      - scripts/framer-dom-probe.mjs
      - .github/workflows/framer-dom-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe rendered DOM
        run: node scripts/framer-dom-probe.mjs > "$RUNNER_TEMP/framer-dom-probe.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: framer-dom-probe-${{ github.sha }}
          path: ${{ runner.temp }}/framer-dom-probe.json
          retention-days: 7
