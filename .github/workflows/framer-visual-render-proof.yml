name: Framer Visual Render Proof

on:
  push:
    branches: [main]
    paths:
      - scripts/framer-visual-render-proof.mjs
      - .github/workflows/framer-visual-render-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render real pages
        run: node scripts/framer-visual-render-proof.mjs > "$RUNNER_TEMP/render-report.json"
      - name: Show safe render report
        run: cat "$RUNNER_TEMP/render-report.json"
      - name: Upload visual proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: framer-visual-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/preview.png
            ${{ runner.temp }}/home.png
            ${{ runner.temp }}/render-report.json
          retention-days: 7
