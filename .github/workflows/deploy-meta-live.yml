name: Deploy Birdie Agent Meta live
run-name: Meta production ${{ inputs.release_sha }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact current protected main SHA"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_BIRDIE_META_PRODUCTION"
        required: true
        type: string

permissions: {}

concurrency:
  group: birdie-agent-meta-live
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0251788487
  GCP_REGION: europe-west3
  CLOUD_RUN_SERVICE: birdie-agent
  ARTIFACT_REPOSITORY: birdie-agent-releases
  WIF_PROVIDER: projects/893591677320/locations/global/workloadIdentityPools/github-birdie-agent/providers/github-birdie-agent
  DEPLOYER_SERVICE_ACCOUNT: birdie-github-deployer@gen-lang-client-0251788487.iam.gserviceaccount.com
  META_INSTAGRAM_ACCOUNT_ID: '17841440257520993'
  META_INSTAGRAM_USERNAME: birdieandbreakfast
  META_API_VERSION: v24.0
  EXPECTED_REPOSITORY: zm56snbdvp-hash/birdie-agent
  EXPECTED_REPOSITORY_ID: "1329217661"
  EXPECTED_OWNER_ID: "315131667"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: birdie-cloud-run-no-traffic
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable production invocation
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
          ACTUAL_OWNER_ID: ${{ github.repository_owner_id }}
          REF_PROTECTED: ${{ github.ref_protected }}
          CONFIGURED_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CONFIGURED_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          ENVIRONMENT_GUARD: ${{ vars.BIRDIE_NO_TRAFFIC_ENVIRONMENT_GUARD }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTUAL_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$ACTUAL_OWNER_ID" = "$EXPECTED_OWNER_ID"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "DEPLOY_BIRDIE_META_PRODUCTION"
          test "$CONFIGURED_WIF_PROVIDER" = "$WIF_PROVIDER"
          test "$CONFIGURED_DEPLOYER_SERVICE_ACCOUNT" = "$DEPLOYER_SERVICE_ACCOUNT"
          test "$ENVIRONMENT_GUARD" = "BIRDIE_NO_TRAFFIC_PROTECTED_V1"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Authenticate to Google Cloud with protected OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '577.0.0'
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify required Meta secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for secret in META_APP_SECRET META_WEBHOOK_VERIFY_TOKEN META_INSTAGRAM_ACCESS_TOKEN; do
            gcloud secrets describe "$secret" --project "$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          done

      - name: Build and push exact main image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy candidate with zero traffic and Meta runtime
        shell: bash
        run: |
          set -euo pipefail
          TAG="meta-${GITHUB_SHA::12}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "$IMAGE" \
            --tag "$TAG" \
            --no-traffic \
            --update-env-vars "META_INSTAGRAM_ACCOUNT_ID=$META_INSTAGRAM_ACCOUNT_ID,META_INSTAGRAM_USERNAME=$META_INSTAGRAM_USERNAME,META_API_VERSION=$META_API_VERSION" \
            --update-secrets "META_APP_SECRET=META_APP_SECRET:latest,META_WEBHOOK_VERIFY_TOKEN=META_WEBHOOK_VERIFY_TOKEN:latest,META_INSTAGRAM_ACCESS_TOKEN=META_INSTAGRAM_ACCESS_TOKEN:latest" \
            --quiet
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format="value(status.traffic[?tag='$TAG'].url)")"
          test -n "$URL"
          echo "CANDIDATE_URL=$URL" >> "$GITHUB_ENV"

      - name: Minimal candidate smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 "$CANDIDATE_URL/health" >/tmp/health.json
          grep -Eq 'success|ok|healthy|version' /tmp/health.json

      - name: Shift live traffic to candidate
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.latestCreatedRevisionName)')"
          test -n "$REVISION"
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$REVISION=100" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)'
