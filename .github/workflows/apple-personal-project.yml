name: Birdie Personal Watch Project

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "clients/apple/**"
      - ".github/workflows/apple-personal-project.yml"
  push:
    branches: [main]
    paths:
      - "clients/apple/**"
      - ".github/workflows/apple-personal-project.yml"

permissions:
  contents: read

jobs:
  personal-project:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate free Personal Team project
        working-directory: clients/apple
        run: xcodegen generate --spec project.personal.yml
      - name: Run BirdiePhone unit tests
        working-directory: clients/apple
        shell: bash
        run: |
          set -euo pipefail
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr '.' '-')"
          simulator_udid="$(
            xcrun simctl list devices available --json |
              jq -r --arg runtime "$runtime" '
                (.devices[$runtime] // [])
                | map(select(.isAvailable == true and (.name | startswith("iPhone"))))
                | first
                | .udid // empty
              '
          )"
          test -n "$simulator_udid"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcodebuild \
            -project BirdiePersonal.xcodeproj \
            -scheme BirdiePersonal \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -destination-timeout 120 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
      - name: Verify project without signing
        working-directory: clients/apple
        run: |
          set -euo pipefail
          xcodebuild \
            -project BirdiePersonal.xcodeproj \
            -scheme BirdiePersonal \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package ready-to-open Xcode project
        working-directory: clients
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent apple "$RUNNER_TEMP/Birdie-Personal-Watch-Xcode.zip"
      - name: Upload personal install package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Birdie-Personal-Watch-Xcode
          path: ${{ runner.temp }}/Birdie-Personal-Watch-Xcode.zip
          if-no-files-found: error
          retention-days: 30
