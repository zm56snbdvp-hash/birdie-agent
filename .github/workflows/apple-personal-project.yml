name: Birdie Personal Watch Project

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "clients/apple/**"
      - "scripts/smoke-ios-birdie-trust.sh"
      - "test/birdie-trust-contract.test.mjs"
      - ".github/workflows/apple-personal-project.yml"
  push:
    branches: [main]
    paths:
      - "clients/apple/**"
      - "scripts/smoke-ios-birdie-trust.sh"
      - "test/birdie-trust-contract.test.mjs"
      - ".github/workflows/apple-personal-project.yml"

permissions:
  contents: read

jobs:
  personal-project:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "16.4"
      - name: Install pinned XcodeGen 2.46.0
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Contract, personal project, unsigned build, and unit smoke test
        env:
          BIRDIE_XCODEGEN_SPEC: project.personal.yml
          BIRDIE_XCODE_PROJECT: BirdiePersonal.xcodeproj
          BIRDIE_XCODE_SCHEME: BirdiePersonal
        run: bash scripts/smoke-ios-birdie-trust.sh
      - name: Package ready-to-open Xcode project
        working-directory: clients
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent apple "$RUNNER_TEMP/Birdie-Personal-Watch-Xcode.zip"
      - name: Upload personal install package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Birdie-Personal-Watch-Xcode
          path: ${{ runner.temp }}/Birdie-Personal-Watch-Xcode.zip
          if-no-files-found: error
          retention-days: 30
