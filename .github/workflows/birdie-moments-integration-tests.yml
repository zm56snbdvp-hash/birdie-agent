name: Birdie Moments Integration Tests

on:
  push:
    branches:
      - feature/birdie-moments-v1-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run full repository test suite
        run: npm test
