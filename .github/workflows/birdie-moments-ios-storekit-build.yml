name: Birdie Moments iOS StoreKit Build

on:
  push:
    branches:
      - feature/birdie-moments-v1-ios-storekit
    paths:
      - "clients/apple/**"
      - ".github/workflows/birdie-moments-ios-storekit-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: clients/apple
        run: xcodegen generate

      - name: Build BirdiePhone without signing
        working-directory: clients/apple
        run: |
          set -euo pipefail
          xcodebuild \
            -project Birdie.xcodeproj \
            -scheme Birdie \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
