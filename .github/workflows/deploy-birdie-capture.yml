name: Deploy Birdie Capture candidate
run-name: Birdie Capture candidate ${{ inputs.release_sha }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_BIRDIE_CAPTURE_STAGE_A"
        required: true
        type: string

permissions: {}

concurrency:
  group: birdie-capture-deployment
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: zm56snbdvp-hash/birdie-agent
  GCP_PROJECT_ID: gen-lang-client-0251788487
  GCP_REGION: europe-west3
  CLOUD_RUN_SERVICE: birdie-agent
  EXPECTED_WIF_PROVIDER: projects/893591677320/locations/global/workloadIdentityPools/github-birdie-agent/providers/github-birdie-agent
  EXPECTED_DEPLOYER_SERVICE_ACCOUNT: birdie-github-deployer@gen-lang-client-0251788487.iam.gserviceaccount.com
  EXPECTED_RUNTIME_SERVICE_ACCOUNT: 893591677320-compute@developer.gserviceaccount.com
  EXPECTED_ARTIFACT_REPOSITORY: birdie-agent-releases
  EXPECTED_BIRDIE_APP_OAUTH_ISSUER: https://dev-dfveukr86fg3e8fr.eu.auth0.com/
  EXPECTED_BIRDIE_APP_OAUTH_AUDIENCE: https://birdie-agent-893591677320.europe-west3.run.app
  EXPECTED_BIRDIE_APP_BIRDIE_ID_CLAIM: https://birdieandbreakfast.de/birdie_id
  EXPECTED_BIRDIE_APP_OAUTH_JWKS_URL: https://dev-dfveukr86fg3e8fr.eu.auth0.com/.well-known/jwks.json
  BIRDIE_CAPTURE_FIRESTORE_DATABASE: "(default)"
  BIRDIE_CAPTURE_FIRESTORE_COLLECTION: captures

jobs:
  validate:
    name: Validate exact capture candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable invocation
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "DEPLOY_BIRDIE_CAPTURE_STAGE_A"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Run tests and build credential-free image
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "birdie-agent-capture:$GITHUB_SHA" .
          docker save "birdie-agent-capture:$GITHUB_SHA" --output "$RUNNER_TEMP/birdie-agent-capture.tar"
      - name: Upload immutable image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birdie-agent-capture-image-${{ github.sha }}
          path: ${{ runner.temp }}/birdie-agent-capture.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy capture at zero traffic
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: birdie-cloud-run-no-traffic
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate protected provider coordinates
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          ENVIRONMENT_GUARD: ${{ vars.BIRDIE_NO_TRAFFIC_ENVIRONMENT_GUARD }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WIF_PROVIDER" = "$EXPECTED_WIF_PROVIDER"
          test "$DEPLOYER_SERVICE_ACCOUNT" = "$EXPECTED_DEPLOYER_SERVICE_ACCOUNT"
          test "$RUNTIME_SERVICE_ACCOUNT" = "$EXPECTED_RUNTIME_SERVICE_ACCOUNT"
          test "$ARTIFACT_REPOSITORY" = "$EXPECTED_ARTIFACT_REPOSITORY"
          test "$ENVIRONMENT_GUARD" = "BIRDIE_NO_TRAFFIC_PROTECTED_V1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download verified image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: birdie-agent-capture-image-${{ github.sha }}
          path: ${{ runner.temp }}/image-artifact
      - name: Load verified image
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/image-artifact/birdie-agent-capture.tar"
          docker image inspect "birdie-agent-capture:$GITHUB_SHA" > /dev/null
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: "577.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Verify Firestore and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud firestore databases describe "$BIRDIE_CAPTURE_FIRESTORE_DATABASE" \
            --project "$GCP_PROJECT_ID" --format='value(name)' > /dev/null
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/service-before.json"
          runtime_sa="$(jq -r '.spec.template.spec.serviceAccountName // .template.serviceAccount // empty' "$RUNNER_TEMP/service-before.json")"
          test "$runtime_sa" = "$EXPECTED_RUNTIME_SERVICE_ACCOUNT"
          previous_revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)] | if length == 1 and .[0].percent == 100 then .[0].revisionName else empty end' "$RUNNER_TEMP/service-before.json")"
          test -n "$previous_revision"
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"
      - name: Push immutable image
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          image_uri="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$EXPECTED_ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE"
          image_tag="$image_uri:capture-$GITHUB_SHA-$GITHUB_RUN_ID"
          docker tag "birdie-agent-capture:$GITHUB_SHA" "$image_tag"
          docker push "$image_tag"
          image_digest="$(gcloud artifacts docker images describe "$image_tag" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
      - name: Deploy capture candidate at zero traffic
        id: candidate
        env:
          IMAGE_URI: ${{ steps.registry.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.registry.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          revision_suffix="capture-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          candidate_tag="capture-${GITHUB_RUN_ID}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed \
            --image "$IMAGE_URI@$IMAGE_DIGEST" --revision-suffix "$revision_suffix" \
            --tag "$candidate_tag" --no-traffic \
            --update-env-vars "BIRDIE_APP_OAUTH_ISSUER=$EXPECTED_BIRDIE_APP_OAUTH_ISSUER,BIRDIE_APP_OAUTH_AUDIENCE=$EXPECTED_BIRDIE_APP_OAUTH_AUDIENCE,BIRDIE_APP_BIRDIE_ID_CLAIM=$EXPECTED_BIRDIE_APP_BIRDIE_ID_CLAIM,BIRDIE_APP_OAUTH_JWKS_URL=$EXPECTED_BIRDIE_APP_OAUTH_JWKS_URL,BIRDIE_CAPTURE_ENABLED=true,BIRDIE_CAPTURE_FIRESTORE_PROJECT_ID=$GCP_PROJECT_ID,BIRDIE_CAPTURE_FIRESTORE_DATABASE=$BIRDIE_CAPTURE_FIRESTORE_DATABASE,BIRDIE_CAPTURE_FIRESTORE_COLLECTION=$BIRDIE_CAPTURE_FIRESTORE_COLLECTION" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-candidate.json"
          revision="$(jq -r '.status.latestCreatedRevisionName' "$RUNNER_TEMP/service-candidate.json")"
          candidate_url="$(jq -r --arg revision "$revision" --arg tag "$candidate_tag" '[.status.traffic[]? | select(.revisionName == $revision and .tag == $tag and (.percent // 0) == 0)][0].url // empty' "$RUNNER_TEMP/service-candidate.json")"
          test -n "$revision"
          [[ "$candidate_url" =~ ^https:// ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
      - name: Candidate smoke and route gate
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.candidate_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 "$CANDIDATE_URL/" | jq -e '.success == true and .version == "2.9.0"' > /dev/null
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/capture-unauthorized.json" --write-out '%{http_code}' "$CANDIDATE_URL/birdie-app/v1/captures")"
          test "$status" = "401"
          jq -e '.success == false and .error == "BIRDIE_APP_UNAUTHENTICATED"' "$RUNNER_TEMP/capture-unauthorized.json" > /dev/null
      - name: Preserve default traffic
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-after.json"
          jq -e --arg revision "$REVISION" '[.status.traffic[]? | select((.percent // 0) > 0)] | length == 1 and .[0].percent == 100 and .[0].revisionName != $revision' "$RUNNER_TEMP/service-after.json" > /dev/null
      - name: Upload sanitized candidate receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birdie-capture-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/service-after.json
          retention-days: 7
