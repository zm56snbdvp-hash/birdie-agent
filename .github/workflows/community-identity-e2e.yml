name: Community Identity Resolver E2E

on:
  push:
    branches:
      - test/community-identity-resolver-e2e
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_IDENTITY_E2E to execute the guarded live resolver test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run resolver unit tests
        run: node --test test/community-identity-resolution.test.mjs test/community-identity-service.test.mjs test/community-write-gate.test.mjs

  verify-read-only-health:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[VERIFY_BIRDIE_OS_HEALTH_ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BIRDIE_OS_BASE: https://script.google.com/macros/s/AKfycbxw3TfFJzsdL-R44xnFqS-KtdhCZ_iFh9HCZEG7nngTteMab2EdRrBOmB3ia6ci_FbYYw/exec
      BIRDIE_OS_API_KEY: ${{ secrets.BIRDIE_OS_API_KEY }}
    steps:
      - name: Verify Birdie OS v3.3.1 is read-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BIRDIE_OS_BASE;
          const key = process.env.BIRDIE_OS_API_KEY;
          if (!key) throw new Error('Birdie OS CI secret missing');
          const url = new URL(base);
          url.searchParams.set('action', 'health');
          url.searchParams.set('api_key', key);
          const response = await fetch(url, { redirect: 'follow' });
          const text = await response.text();
          let body;
          try { body = JSON.parse(text); }
          catch { throw new Error('Birdie OS health returned non-JSON'); }
          if (!response.ok || body.success !== true) {
            throw new Error(`Birdie OS health failed: ${body?.error || response.status}`);
          }
          console.log(`Birdie OS health verified: version=${body.version} mode=${body.mode}`);
          if (body.version !== '3.3.1') {
            throw new Error(`Unexpected Birdie OS version: ${body.version}`);
          }
          if (body.mode !== 'READ_ONLY') {
            throw new Error(`Global controlled-write gate is not closed: mode=${body.mode}`);
          }
          NODE

  live-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_IDENTITY_E2E'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BIRDIE_OS_BASE: https://script.google.com/macros/s/AKfycbxw3TfFJzsdL-R44xnFqS-KtdhCZ_iFh9HCZEG7nngTteMab2EdRrBOmB3ia6ci_FbYYw/exec
      BIRDIE_OS_API_KEY: ${{ secrets.BIRDIE_OS_API_KEY }}
      BIRDIE_AGENT_BASE: http://127.0.0.1:8080
      BIRDIE_AGENT_API_KEY: birdie-ci-e2e-local-only
      OPENAI_API_KEY: birdie-ci-e2e-not-used
      E2E_CONFIRM: RUN_IDENTITY_E2E
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require existing Birdie OS CI secret
        shell: bash
        run: |
          if [ -z "$BIRDIE_OS_API_KEY" ]; then
            echo "BIRDIE_OS_API_KEY is not available to this workflow; refusing live E2E execution."
            exit 2
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start feature-branch Birdie Agent locally
        shell: bash
        run: |
          node server.mjs > /tmp/birdie-agent-e2e.log 2>&1 &
          echo $! > /tmp/birdie-agent-e2e.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/birdie-agent-e2e.log
          exit 1

      - name: Run guarded live resolver E2E
        run: node scripts/community-identity-e2e.mjs

      - name: Stop local Birdie Agent
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/birdie-agent-e2e.pid ]; then
            kill "$(cat /tmp/birdie-agent-e2e.pid)" || true
          fi
