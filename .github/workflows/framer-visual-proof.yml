name: Framer Visual Proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/framer-visual-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Diagnose exact rendered page
        shell: bash
        env:
          TARGET_URL: https://incredible-orchid-383950-fff11016c.framer.app/new-birdie?diag=fff11016c
        run: |
          set -euo pipefail
          cat > "proof.mjs" <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const target = process.env.TARGET_URL;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 1280, height: 1200 }, deviceScaleFactor: 1 });
          const response = await page.goto(target, { waitUntil: "networkidle", timeout: 120000 });

          const bySel = async (selector) => {
            const loc = page.locator(selector).first();
            const count = await loc.count();
            if (!count) return null;
            return {
              count,
              box: await loc.boundingBox(),
              text: (await loc.innerText().catch(()=>"")).slice(0,1200),
              src: await loc.getAttribute("src").catch(()=>null),
              style: await loc.evaluate((el) => {
                const s = getComputedStyle(el);
                return {
                  display:s.display, position:s.position, zIndex:s.zIndex,
                  width:s.width, height:s.height, overflow:s.overflow,
                  backgroundImage:s.backgroundImage, opacity:s.opacity,
                  transform:s.transform
                };
              }).catch(()=>null)
            };
          };

          const inspectPoints = await page.evaluate(() => {
            const points = [[80,80],[120,220],[200,420],[640,220],[1000,220],[640,620],[100,680]];
            const serialize = (el) => {
              const s = getComputedStyle(el);
              const r = el.getBoundingClientRect();
              return {
                tag:el.tagName,
                id:el.id || null,
                className:typeof el.className === "string" ? el.className : null,
                src:el.getAttribute?.("src") || null,
                alt:el.getAttribute?.("alt") || null,
                text:(el.innerText || "").slice(0,160),
                position:s.position,
                zIndex:s.zIndex,
                opacity:s.opacity,
                backgroundImage:s.backgroundImage,
                box:{x:r.x,y:r.y,width:r.width,height:r.height}
              };
            };
            return points.map(([x,y]) => ({
              x,y,
              stack:document.elementsFromPoint(x,y).slice(0,12).map(serialize)
            }));
          });

          const images = await page.evaluate(() => Array.from(document.images).map((el) => {
            const r=el.getBoundingClientRect();
            const s=getComputedStyle(el);
            return {
              src:el.currentSrc || el.src,
              alt:el.alt || null,
              className:el.className || null,
              parentClass:el.parentElement?.className || null,
              box:{x:r.x,y:r.y,width:r.width,height:r.height},
              position:s.position,zIndex:s.zIndex,opacity:s.opacity,objectFit:s.objectFit
            };
          }));

          const topCovering = await page.evaluate(() => Array.from(document.querySelectorAll("*")).map((el) => {
            const r=el.getBoundingClientRect();
            const s=getComputedStyle(el);
            return {
              tag:el.tagName,id:el.id||null,className:typeof el.className==="string"?el.className:null,
              backgroundImage:s.backgroundImage,position:s.position,zIndex:s.zIndex,opacity:s.opacity,
              box:{x:r.x,y:r.y,width:r.width,height:r.height}
            };
          }).filter((x) =>
            x.box.width > 900 && x.box.height > 350 && x.box.y < 650 &&
            (x.backgroundImage !== "none" || x.position === "absolute" || x.position === "fixed")
          ).slice(0,80));

          const result = {
            requestedUrl: target,
            finalUrl: page.url(),
            status: response?.status() ?? null,
            title: await page.title(),
            bodyText: (await page.locator("body").innerText()).slice(0,16000),
            selectors: {
              root: await bySel(".bb-root"),
              hero: await bySel(".hero"),
              heroCopy: await bySel(".hero-copy"),
              heroVisual: await bySel(".hero-visual"),
              heroArtMain: await bySel(".hero-art-main"),
              heroHoodieCard: await bySel(".hero-hoodie-card")
            },
            pointStacks: inspectPoints,
            images,
            topCovering
          };

          fs.writeFileSync(process.env.RUNNER_TEMP + "/visual-proof.json", JSON.stringify(result, null, 2));
          await page.screenshot({ path: process.env.RUNNER_TEMP + "/page.png", fullPage: true });
          if (await page.locator(".hero").count()) await page.locator(".hero").first().screenshot({path:process.env.RUNNER_TEMP+"/hero.png"});
          await browser.close();
          EOF
          node "proof.mjs"

      - name: Upload proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: framer-visual-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/visual-proof.json
            ${{ runner.temp }}/page.png
            ${{ runner.temp }}/hero.png
          if-no-files-found: error
          retention-days: 7
