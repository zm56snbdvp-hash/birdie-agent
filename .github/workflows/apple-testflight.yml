name: Birdie TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: birdie-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required Apple secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_B64 APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: clients/apple
      - name: Generate Xcode project
        working-directory: clients/apple
        run: xcodegen generate
      - name: Materialize App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import pathlib

          key_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "AuthKey.p8"
          key_path.write_bytes(base64.b64decode(os.environ["APP_STORE_CONNECT_KEY_B64"], validate=True))
          key_path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"APP_STORE_CONNECT_KEY_PATH={key_path}\n")
          PY
      - name: Build and upload to TestFlight
        working-directory: clients/apple
        run: bundle exec fastlane ios beta
