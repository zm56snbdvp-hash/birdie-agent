name: Deploy Birdie Coin supporter production
run-name: Coin supporter production ${{ inputs.release_sha }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_BIRDIE_COIN_SUPPORTER_PRODUCTION"
        required: true
        type: string

permissions: {}

concurrency:
  group: birdie-agent-coin-supporter-production
  cancel-in-progress: false

env:
  EXPECTED_VERSION: 2.9.0
  EXPECTED_REPOSITORY: zm56snbdvp-hash/birdie-agent
  EXPECTED_REPOSITORY_ID: "1329217661"
  EXPECTED_OWNER_ID: "315131667"
  GCP_PROJECT_ID: gen-lang-client-0251788487
  GCP_REGION: europe-west3
  CLOUD_RUN_SERVICE: birdie-agent
  EXPECTED_WIF_PROVIDER: projects/893591677320/locations/global/workloadIdentityPools/github-birdie-agent/providers/github-birdie-agent
  EXPECTED_DEPLOYER_SERVICE_ACCOUNT: birdie-github-deployer@gen-lang-client-0251788487.iam.gserviceaccount.com
  EXPECTED_RUNTIME_SERVICE_ACCOUNT: 893591677320-compute@developer.gserviceaccount.com
  EXPECTED_ARTIFACT_REPOSITORY: birdie-agent-releases
  EXPECTED_BIRDIE_APP_OAUTH_ISSUER: https://dev-dfveukr86fg3e8fr.eu.auth0.com/
  EXPECTED_BIRDIE_APP_OAUTH_AUDIENCE: https://birdie-agent-893591677320.europe-west3.run.app
  EXPECTED_BIRDIE_APP_BIRDIE_ID_CLAIM: https://birdieandbreakfast.de/birdie_id
  EXPECTED_BIRDIE_APP_OAUTH_JWKS_URL: https://dev-dfveukr86fg3e8fr.eu.auth0.com/.well-known/jwks.json
  EXPECTED_META_INSTAGRAM_ACCOUNT_ID: "17841440257520993"
  EXPECTED_META_INSTAGRAM_USERNAME: birdieandbreakfast
  EXPECTED_META_API_VERSION: v24.0

jobs:
  validate:
    name: Validate exact production candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable invocation
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
          ACTUAL_OWNER_ID: ${{ github.repository_owner_id }}
          REF_PROTECTED: ${{ github.ref_protected }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTUAL_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$ACTUAL_OWNER_ID" = "$EXPECTED_OWNER_ID"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "DEPLOY_BIRDIE_COIN_SUPPORTER_PRODUCTION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Run required release gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          npm ci
          npm test
          node --check auth0/actions/birdie-supporter-claims.js
          curl --fail --silent --show-error --retry 3 "$EXPECTED_BIRDIE_APP_OAUTH_JWKS_URL" \
            | jq -e '.keys | length > 0 and all(.[]; .kty == "RSA")' > /dev/null

      - name: Build credential-free image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$EXPECTED_VERSION" \
            --tag "birdie-agent-release:$GITHUB_SHA" .
          docker save "birdie-agent-release:$GITHUB_SHA" \
            --output "$RUNNER_TEMP/birdie-agent-release.tar"

      - name: Upload immutable image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birdie-agent-image-${{ github.sha }}
          path: ${{ runner.temp }}/birdie-agent-release.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy, verify, and promote exact revision
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: birdie-cloud-run-no-traffic
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate protected provider coordinates
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          ENVIRONMENT_GUARD: ${{ vars.BIRDIE_NO_TRAFFIC_ENVIRONMENT_GUARD }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WIF_PROVIDER" = "$EXPECTED_WIF_PROVIDER"
          test "$DEPLOYER_SERVICE_ACCOUNT" = "$EXPECTED_DEPLOYER_SERVICE_ACCOUNT"
          test "$RUNTIME_SERVICE_ACCOUNT" = "$EXPECTED_RUNTIME_SERVICE_ACCOUNT"
          test "$ARTIFACT_REPOSITORY" = "$EXPECTED_ARTIFACT_REPOSITORY"
          test "$ENVIRONMENT_GUARD" = "BIRDIE_NO_TRAFFIC_PROTECTED_V1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download verified image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: birdie-agent-image-${{ github.sha }}
          path: ${{ runner.temp }}/image-artifact

      - name: Load verified image
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/image-artifact/birdie-agent-release.tar"
          docker load --input "$RUNNER_TEMP/image-artifact/birdie-agent-release.tar"
          docker image inspect "birdie-agent-release:$GITHUB_SHA" > /dev/null

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: "577.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify required Meta secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for secret in META_APP_SECRET META_WEBHOOK_VERIFY_TOKEN META_INSTAGRAM_ACCESS_TOKEN; do
            gcloud secrets describe "$secret" --project "$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          done

      - name: Capture protected production state
        id: before
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/service-before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/iam-before.json"
          runtime_sa="$(jq -r '.spec.template.spec.serviceAccountName // .template.serviceAccount // empty' "$RUNNER_TEMP/service-before.json")"
          test "$runtime_sa" = "$RUNTIME_SERVICE_ACCOUNT"
          previous_revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)] | if length == 1 and .[0].percent == 100 then .[0].revisionName else empty end' "$RUNNER_TEMP/service-before.json")"
          test -n "$previous_revision"
          jq -S '.bindings // []' "$RUNNER_TEMP/iam-before.json" > "$RUNNER_TEMP/iam-before-normalized.json"
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"
          echo "runtime_service_account=$runtime_sa" >> "$GITHUB_OUTPUT"

      - name: Push immutable image
        id: registry
        env:
          ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          image_uri="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE"
          image_tag="$image_uri:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "birdie-agent-release:$GITHUB_SHA" "$image_tag"
          docker push "$image_tag"
          image_digest="$(gcloud artifacts docker images describe "$image_tag" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Deploy configured candidate at zero traffic
        id: candidate
        env:
          IMAGE_URI: ${{ steps.registry.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.registry.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          revision_suffix="coin-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_tag="coin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "$IMAGE_URI@$IMAGE_DIGEST" \
            --revision-suffix "$revision_suffix" \
            --tag "$candidate_tag" \
            --no-traffic \
            --update-env-vars "BIRDIE_APP_OAUTH_ISSUER=$EXPECTED_BIRDIE_APP_OAUTH_ISSUER,BIRDIE_APP_OAUTH_AUDIENCE=$EXPECTED_BIRDIE_APP_OAUTH_AUDIENCE,BIRDIE_APP_BIRDIE_ID_CLAIM=$EXPECTED_BIRDIE_APP_BIRDIE_ID_CLAIM,BIRDIE_APP_OAUTH_JWKS_URL=$EXPECTED_BIRDIE_APP_OAUTH_JWKS_URL,META_INSTAGRAM_ACCOUNT_ID=$EXPECTED_META_INSTAGRAM_ACCOUNT_ID,META_INSTAGRAM_USERNAME=$EXPECTED_META_INSTAGRAM_USERNAME,META_API_VERSION=$EXPECTED_META_API_VERSION" \
            --update-secrets "META_APP_SECRET=META_APP_SECRET:latest,META_WEBHOOK_VERIFY_TOKEN=META_WEBHOOK_VERIFY_TOKEN:latest,META_INSTAGRAM_ACCESS_TOKEN=META_INSTAGRAM_ACCESS_TOKEN:latest" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/service-candidate.json"
          revision="$(jq -r '.status.latestCreatedRevisionName' "$RUNNER_TEMP/service-candidate.json")"
          candidate_url="$(jq -r --arg revision "$revision" --arg tag "$candidate_tag" '[.status.traffic[]? | select(.revisionName == $revision and .tag == $tag and (.percent // 0) == 0)][0].url // empty' "$RUNNER_TEMP/service-candidate.json")"
          test -n "$revision"
          [[ "$candidate_url" =~ ^https:// ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"

      - name: Minimal security-critical candidate smoke
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.candidate_url }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.before.outputs.runtime_service_account }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run revisions describe "$REVISION" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/revision-candidate.json"
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" '(.spec.serviceAccountName // .spec.template.spec.serviceAccountName // .template.serviceAccount) == $sa' "$RUNNER_TEMP/revision-candidate.json" > /dev/null
          for pair in \
            "BIRDIE_APP_OAUTH_ISSUER=$EXPECTED_BIRDIE_APP_OAUTH_ISSUER" \
            "BIRDIE_APP_OAUTH_AUDIENCE=$EXPECTED_BIRDIE_APP_OAUTH_AUDIENCE" \
            "BIRDIE_APP_BIRDIE_ID_CLAIM=$EXPECTED_BIRDIE_APP_BIRDIE_ID_CLAIM" \
            "BIRDIE_APP_OAUTH_JWKS_URL=$EXPECTED_BIRDIE_APP_OAUTH_JWKS_URL" \
            "META_INSTAGRAM_ACCOUNT_ID=$EXPECTED_META_INSTAGRAM_ACCOUNT_ID" \
            "META_INSTAGRAM_USERNAME=$EXPECTED_META_INSTAGRAM_USERNAME" \
            "META_API_VERSION=$EXPECTED_META_API_VERSION"; do
            name="${pair%%=*}"
            expected="${pair#*=}"
            actual="$(jq -r --arg name "$name" '[.spec.containers[0].env[]? | select(.name == $name)][0].value // empty' "$RUNNER_TEMP/revision-candidate.json")"
            test "$actual" = "$expected"
          done
          for secret in META_APP_SECRET META_WEBHOOK_VERIFY_TOKEN META_INSTAGRAM_ACCESS_TOKEN; do
            jq -e --arg name "$secret" '
              [.spec.containers[0].env[]? | select(.name == $name)][0].valueFrom.secretKeyRef as $ref
              | (($ref.name // $ref.secret // "") == $name)
                and (($ref.key // $ref.version // "") == "latest")
            ' "$RUNNER_TEMP/revision-candidate.json" > /dev/null
          done
          curl --fail --silent --show-error --retry 4 "$CANDIDATE_URL/" \
            | jq -e --arg version "$EXPECTED_VERSION" '.success == true and .version == $version and .birdieWorld == "AUTHENTICATED_LEDGER_PROJECTION"' > /dev/null
          meta_status="$(curl --silent --show-error --output "$RUNNER_TEMP/meta-wrong-token.txt" --write-out '%{http_code}' "$CANDIDATE_URL/meta/webhook?hub.mode=subscribe&hub.verify_token=definitely-not-birdie&hub.challenge=ping")"
          test "$meta_status" = "403"
          grep -Fx "Forbidden" "$RUNNER_TEMP/meta-wrong-token.txt" > /dev/null
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/supporter-unauthorized.json" --write-out '%{http_code}' "$CANDIDATE_URL/birdie-app/v1/coin/profile?birdieId=ATTACKER")"
          test "$status" = "401"
          jq -e '.success == false and .error == "BIRDIE_APP_UNAUTHENTICATED"' "$RUNNER_TEMP/supporter-unauthorized.json" > /dev/null
          admin_status="$(curl --silent --show-error --output "$RUNNER_TEMP/admin-unauthorized.json" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$CANDIDATE_URL/coin/claims")"
          test "$admin_status" = "401"
          jq -e '.success == false and .error == "UNAUTHORIZED"' "$RUNNER_TEMP/admin-unauthorized.json" > /dev/null

      - name: Verify IAM unchanged before promotion
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/iam-candidate.json"
          jq -S '.bindings // []' "$RUNNER_TEMP/iam-candidate.json" > "$RUNNER_TEMP/iam-candidate-normalized.json"
          cmp "$RUNNER_TEMP/iam-before-normalized.json" "$RUNNER_TEMP/iam-candidate-normalized.json"

      - name: Promote exact healthy revision to production
        id: promote
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$REVISION=100" \
            --quiet

      - name: Verify production traffic and public auth boundary
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/service-live.json"
          jq -e --arg revision "$REVISION" '[.status.traffic[]? | select((.percent // 0) > 0)] | length == 1 and .[0].revisionName == $revision and .[0].percent == 100' "$RUNNER_TEMP/service-live.json" > /dev/null
          service_url="$(jq -r '.status.url' "$RUNNER_TEMP/service-live.json")"
          curl --fail --silent --show-error --retry 4 "$service_url/" \
            | jq -e --arg version "$EXPECTED_VERSION" '.success == true and .version == $version and .birdieWorld == "AUTHENTICATED_LEDGER_PROJECTION"' > /dev/null
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/live-unauthorized.json" --write-out '%{http_code}' "$service_url/birdie-app/v1/coin/profile")"
          test "$status" = "401"
          jq -e '.success == false and .error == "BIRDIE_APP_UNAUTHENTICATED"' "$RUNNER_TEMP/live-unauthorized.json" > /dev/null
          meta_status="$(curl --silent --show-error --output "$RUNNER_TEMP/live-meta-wrong-token.txt" --write-out '%{http_code}' "$service_url/meta/webhook?hub.mode=subscribe&hub.verify_token=definitely-not-birdie&hub.challenge=ping")"
          test "$meta_status" = "403"
          grep -Fx "Forbidden" "$RUNNER_TEMP/live-meta-wrong-token.txt" > /dev/null

      - name: Roll back traffic if live verification fails
        if: failure() && steps.promote.outcome == 'success'
        env:
          PREVIOUS_REVISION: ${{ steps.before.outputs.previous_revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$PREVIOUS_REVISION=100" \
            --quiet

      - name: Write sanitized production receipt
        if: success()
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
          IMAGE_DIGEST: ${{ steps.registry.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-receipt
          jq -n \
            --arg schemaVersion "birdie-coin-supporter-production/v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg releaseSha "$GITHUB_SHA" \
            --arg version "$EXPECTED_VERSION" \
            --arg project "$GCP_PROJECT_ID" \
            --arg region "$GCP_REGION" \
            --arg service "$CLOUD_RUN_SERVICE" \
            --arg revision "$REVISION" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg audience "$EXPECTED_BIRDIE_APP_OAUTH_AUDIENCE" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg verifiedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{schemaVersion:$schemaVersion,status:"LIVE",repository:$repository,releaseSha:$releaseSha,version:$version,project:$project,region:$region,service:$service,revision:$revision,imageDigest:$imageDigest,trafficPercent:100,audience:$audience,issuer:"https://dev-dfveukr86fg3e8fr.eu.auth0.com/",birdieIdClaim:"https://birdieandbreakfast.de/birdie_id",checks:["full-tests","auth0-jwks","runtime-auth-config","meta-secret-bindings","meta-wrong-token-fails-closed","candidate-root","supporter-unauthenticated-fails-closed","founder-admin-fails-closed","iam-unchanged","exact-revision-100-percent","live-root"],workflowRun:$workflowRun,verifiedAt:$verifiedAt}' \
            > release-receipt/coin-supporter-production.json

      - name: Upload sanitized production receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coin-supporter-production-${{ github.sha }}
          path: release-receipt/coin-supporter-production.json
          if-no-files-found: error
          retention-days: 30
