<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161814" />
  <title>Birdie App Round Mode — Sandbox UX</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="phone-shell" aria-label="Birdie App sandbox prototype">
    <header class="topbar">
      <div>
        <p class="brand">BIRDIE &amp; BREAKFAST</p>
        <p class="sandbox-badge">SANDBOX · SYNTHETIC DATA</p>
      </div>
      <button class="icon-button" type="button" data-screen="YOU_FOUND_A_BIRDIE" aria-label="Open found Birdie flow">+</button>
    </header>

    <section id="screen" class="screen" aria-live="polite"></section>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button type="button" data-screen="ROUND_HOME">Round</button>
      <button type="button" data-screen="MY_GOLF">My Golf</button>
      <button type="button" data-screen="COLLECTION">Collection</button>
    </nav>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
