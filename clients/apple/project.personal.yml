name: BirdiePersonal
options:
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BirdiePhone:
    type: application
    platform: iOS
    sources:
      - path: BirdiePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie
        PRODUCT_NAME: Birdie
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/BirdiePhone-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/BirdieCapture.entitlements
        BIRDIE_APP_GROUP_IDENTIFIER: group.de.birdieandbreakfast.kevin.birdie.capture
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BirdieWatch
      - target: CaptureCore
      - target: BirdieShare

  CaptureCore:
    type: framework
    platform: iOS
    sources:
      - path: CaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.capturecore
        PRODUCT_NAME: CaptureCore
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  BirdieShare:
    type: app-extension
    platform: iOS
    sources:
      - path: BirdieShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.share
        PRODUCT_NAME: BirdieDrop
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/BirdieShare-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/BirdieCapture.entitlements
        BIRDIE_APP_GROUP_IDENTIFIER: group.de.birdieandbreakfast.kevin.birdie.capture
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: CaptureCore

  BirdieCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CaptureCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.capturetests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CaptureCore

  BirdieWatch:
    type: application
    platform: watchOS
    sources:
      - path: BirdieWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.watchkitapp
        PRODUCT_NAME: Birdie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Birdie
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.birdieandbreakfast.kevin.birdie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BirdieWatchWidget

  BirdieWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: BirdieWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.watchkitapp.widget
        PRODUCT_NAME: BirdieWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  BirdiePersonal:
    build:
      targets:
        BirdiePhone: all
        BirdieWatch: all
        BirdieWatchWidget: all
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - BirdieCaptureTests
    archive:
      config: Release

  BirdieCaptureTests:
    build:
      targets:
        CaptureCore: all
        BirdieCaptureTests: all
    test:
      gatherCoverageData: true
      targets:
        - BirdieCaptureTests
