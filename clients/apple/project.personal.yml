name: BirdiePersonal
options:
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BirdiePhone:
    type: application
    platform: iOS
    sources:
      - path: BirdiePhone
        excludes:
          - Info.plist
          - BirdiePhone.entitlements
      - path: BirdieShared
      - path: BirdieIntents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie
        PRODUCT_NAME: Birdie
        PRODUCT_MODULE_NAME: BirdiePhone
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BirdiePhone/Info.plist
        CODE_SIGN_ENTITLEMENTS: BirdiePhone/BirdiePhone.entitlements
        BIRDIE_SHARED_SUITE_NAME: group.de.birdieandbreakfast.kevin.birdie
        BIRDIE_URL_SCHEME: birdie-personal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BirdieWatch
      - target: BirdieWidgets

  BirdieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BirdieWidgets
        excludes:
          - BirdieWidgets.entitlements
          - Info.plist
      - path: BirdieShared
      - path: BirdieIntents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.daypilot
        PRODUCT_NAME: BirdieWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BirdieWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: BirdieWidgets/BirdieWidgets.entitlements
        BIRDIE_SHARED_SUITE_NAME: group.de.birdieandbreakfast.kevin.birdie
        BIRDIE_URL_SCHEME: birdie-personal
        APPLICATION_EXTENSION_API_ONLY: YES

  BirdiePhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BirdiePhoneTests
    dependencies:
      - target: BirdiePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Birdie.app/Birdie
        BUNDLE_LOADER: $(TEST_HOST)

  BirdieWatch:
    type: application
    platform: watchOS
    sources:
      - path: BirdieWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.watchkitapp
        PRODUCT_NAME: Birdie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Birdie
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.birdieandbreakfast.kevin.birdie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BirdieWatchWidget

  BirdieWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: BirdieWatchWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.kevin.birdie.watchkitapp.widget
        PRODUCT_NAME: BirdieWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BirdieWatchWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  BirdiePersonal:
    build:
      targets:
        BirdiePhone: all
        BirdieWidgets: all
        BirdieWatch: all
        BirdieWatchWidget: all
        BirdiePhoneTests: [test]
    test:
      config: Debug
      targets:
        - BirdiePhoneTests
    run:
      config: Debug
    archive:
      config: Release
