name: Birdie
options:
  bundleIdPrefix: de.birdieandbreakfast
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BirdiePhone:
    type: application
    platform: iOS
    sources:
      - path: BirdiePhone
        excludes:
          - Info.plist
          - BirdiePhone.entitlements
      - path: BirdieShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.birdie
        PRODUCT_NAME: Birdie
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BirdiePhone/Info.plist
        CODE_SIGN_ENTITLEMENTS: BirdiePhone/BirdiePhone.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          BIRDIE_APP_ATTEST_ENVIRONMENT: development
        Release:
          BIRDIE_APP_ATTEST_ENVIRONMENT: production
    dependencies:
      - target: BirdieWatch
      - target: BirdieLiveActivity

  BirdieLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: BirdieLiveActivity
        excludes:
          - Info.plist
      - path: BirdieShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.birdie.liveactivity
        PRODUCT_NAME: BirdieLiveActivity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BirdieLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  BirdieWatch:
    type: application
    platform: watchOS
    sources:
      - path: BirdieWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.birdie.watchkitapp
        PRODUCT_NAME: Birdie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Birdie
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.birdieandbreakfast.birdie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BirdieWatchWidget

  BirdieWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: BirdieWatchWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.birdie.watchkitapp.widget
        PRODUCT_NAME: BirdieWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BirdieWatchWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  BirdiePhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BirdiePhoneTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.birdie.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Birdie.app/Birdie"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: BirdiePhone

schemes:
  Birdie:
    build:
      targets:
        BirdiePhone: all
        BirdieWatch: all
        BirdieWatchWidget: all
        BirdieLiveActivity: all
    run:
      config: Debug
    test:
      targets:
        - BirdiePhoneTests
    archive:
      config: Release
