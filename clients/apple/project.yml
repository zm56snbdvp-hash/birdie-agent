name: Birdie
options:
  bundleIdPrefix: de.birdieandbreakfast
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.2.5

targets:
  BirdiePhone:
    type: application
    platform: iOS
    sources:
      - path: BirdiePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.birdie
        PRODUCT_NAME: Birdie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Birdie
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BirdieWatch

  BirdiePOV:
    type: application
    platform: iOS
    sources:
      - path: BirdiePOV
    configFiles:
      Debug: BirdiePOV/Config/Meta.xcconfig
      Release: BirdiePOV/Config/Meta.xcconfig
    info:
      path: BirdiePOV/Info.plist
    entitlements:
      path: BirdiePOV/BirdiePOV.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.pov
        PRODUCT_NAME: Birdie POV
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit

  BirdieWatch:
    type: application
    platform: watchOS
    sources:
      - path: BirdieWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.birdie.watchkitapp
        PRODUCT_NAME: Birdie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Birdie
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.birdieandbreakfast.birdie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BirdieWatchWidget

  BirdieWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: BirdieWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.birdieandbreakfast.birdie.watchkitapp.widget
        PRODUCT_NAME: BirdieWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Birdie:
    build:
      targets:
        BirdiePhone: all
        BirdieWatch: all
        BirdieWatchWidget: all
    run:
      config: Debug
    archive:
      config: Release

  BirdiePOV:
    build:
      targets:
        BirdiePOV: all
    run:
      config: Debug
    archive:
      config: Release
